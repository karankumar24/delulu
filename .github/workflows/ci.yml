# Typecheck and tests on every push, including shipped.test.ts, which fails when the committed bundles
# in plugin/hook are stale.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npx tsc -p tsconfig.json --noEmit
        working-directory: app
      - run: npx vitest run
        working-directory: app
